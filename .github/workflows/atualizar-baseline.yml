# Mede a baseline no banco oficial com o auditor mínimo e abre um PR com o diff.
# Execute na aba Actions → Atualizar baseline → Run workflow, na main.
# A baseline de qualidade preserva orfaos_conhecidos. A de segurança recusa indicadores graves.
name: Atualizar baseline

on:
  workflow_dispatch:
    inputs:
      baseline:
        description: 'Qual baseline medir'
        type: choice
        required: true
        options:
          - seguranca
          - qualidade
      alvo:
        description: 'Banco oficial (nome histórico: teste)'
        type: choice
        required: true
        default: teste
        options:
          - teste

# O push e a abertura do PR exigem escrita. O push vai para a branch criada pelo run.
permissions:
  contents: write
  pull-requests: write

# Serializa medições que alteram o mesmo arquivo.
concurrency:
  group: atualizar-baseline-${{ inputs.baseline }}
  cancel-in-progress: false

jobs:
  medir:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: auditoria-ci
      deployment: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # O token de escrita NÃO fica no .git/config: os passos de instalação e medição rodam
          # sem ele, e só o `git push` do último passo o recebe (auditoria de 13/10/2026).
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      # Os dois baselines usam psql (login auditor) desde a migração de check_grants.mjs e
      # check_data_quality.mjs para scripts/lib/audit-database.mjs — revisão anterior encontrou
      # este passo condicionado só a `qualidade` (correção confirmada: segurança também precisa).
      - name: Instalar cliente PostgreSQL
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      # TODA entrada passa por `env:` e é lida como "$VAR" no shell — nunca `${{ }}` dentro do
      # `run:`. A interpolação acontece ANTES do shell existir: o valor vira texto no meio do
      # script, e um valor com `;` ou `$(...)` viraria comando. Aqui os inputs são `choice`, então
      # o conjunto é fechado e o risco é teórico — mas a regra vale pelo hábito, não pelo caso:
      # o dia em que alguém trocar `choice` por `string` não vem com um aviso. É a
      # `yaml.github-actions.security.run-shell-injection`, do ruleset `p/github-actions`.
      # Nota histórica: até 14/08/2026 essa regra só rodava no CI (o ./scripts/semgrep.sh local
      # tinha 5 regras), e foi assim que 3 achados dela chegaram ao CI neste arquivo. Hoje os
      # rulesets são vendorizados em .semgrep/vendor/ e o modo padrão do wrapper os roda offline
      # — ver docs/semgrep.md § "Por que a cópia vendorizada existe".
      - name: Medir e atualizar a baseline
        env:
          BASELINE: ${{ inputs.baseline }}
          SUPABASE_TEST_AUDIT_DATABASE_URL: ${{ secrets.SUPABASE_TEST_AUDIT_DATABASE_URL }}
        run: |
          if [ "$BASELINE" = "seguranca" ]; then
            node scripts/check_grants.mjs --atualizar-baseline
          else
            node scripts/check_data_quality.mjs --atualizar-baseline
          fi

      # Sem mudança não há PR. O caso é comum e legítimo: medir de novo um banco que não mudou.
      # Dizer isso em voz alta evita o operador procurar um PR que nunca vai existir.
      - name: Houve mudança?
        id: diff
        env:
          ALVO: ${{ inputs.alvo }}
        run: |
          if git diff --quiet -- scripts/; then
            echo "mudou=nao" >> "$GITHUB_OUTPUT"
            echo "O baseline já estava igual ao banco — nada a propor." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "mudou=sim" >> "$GITHUB_OUTPUT"
            {
              echo "### Diff medido em \`$ALVO\`"
              echo '```diff'
              git diff -- scripts/
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # O diff vai para o RESUMO do run além do PR: no celular, ler o summary é um toque, e abrir
      # o PR são vários. Quem quiser aprovar sem sair da tela do Actions já viu o que vai aprovar.
      - name: Abrir o PR com o diff
        if: steps.diff.outputs.mudou == 'sim'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE: ${{ github.ref_name }}
          BASELINE: ${{ inputs.baseline }}
          ALVO: ${{ inputs.alvo }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          RAMO="baseline/$BASELINE-$ALVO-$RUN_ID"
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git checkout -b "$RAMO"
          git add scripts/
          git commit -m "chore(baseline): mede $BASELINE em $ALVO" -m "Medição do banco oficial pelo workflow 'Atualizar baseline' (run $RUN_ID)."
          # Mesmo cabeçalho que o actions/checkout gravaria, só no ambiente do git push.
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          GIT_CONFIG_COUNT=1 \
            GIT_CONFIG_KEY_0=http.https://github.com/.extraheader \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $AUTH" \
            git push -u origin "$RAMO"
          gh pr create \
            --base "$BASE" \
            --head "$RAMO" \
            --title "chore(baseline): $BASELINE medido em $ALVO" \
            --body "Medição disparada à mão pelo workflow \`Atualizar baseline\` ([run]($RUN_URL)).

          **O que conferir antes do merge**

          - Em \`scripts/security_baseline.json\`, revise \`tipo\`, \`alvo\` e \`detalhe\` de cada exceção. Investigue entradas novas. O script recusa indicadores graves.
          - Em \`scripts/data_quality_baseline.json\`, revise \`achados\` e investigue aumentos em \`qtd\`. A medição preserva \`orfaos_conhecidos\`. Se houve correção de dados, confira a lista mantida à mão.
          - Compare \`gerado_em\` com a data da medição e confirme que a mudança se limita ao arquivo selecionado.

          ---
          _Generated by [Claude Code](https://claude.ai/code)_"
