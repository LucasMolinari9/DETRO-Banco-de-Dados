# O workflow_run carrega este YAML da main, inclusive quando o deploy veio de uma PR.
name: Deploy smoke

on:
  workflow_run:
    workflows: [Deploy smoke event]
    types: [completed]
  workflow_dispatch:
    inputs:
      url:
        description: URL HTTPS do deploy a verificar
        required: true
        type: string
      environment:
        description: Ambiente esperado
        required: true
        default: auto
        type: choice
        options:
          - auto
          - preview
          - production

permissions:
  contents: read
  deployments: read

jobs:
  smoke:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.event == 'deployment_status' &&
        github.event.workflow_run.actor.login == 'vercel[bot]' &&
        github.event.workflow_run.conclusion == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: deploy-smoke
      deployment: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Resolver URL e ambiente a verificar
        id: alvo
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
          INPUT_URL: ${{ inputs.url }}
          INPUT_ENVIRONMENT: ${{ inputs.environment }}
          PRODUCTION_URL: https://divatdetro.vercel.app
        shell: bash
        run: |
          url="$INPUT_URL"
          environment="$INPUT_ENVIRONMENT"
          if [[ "$GITHUB_EVENT_NAME" == 'workflow_run' ]]; then
            # O workflow anterior só sinaliza o evento. A URL vem da API do GitHub,
            # em um status emitido pela Vercel para o SHA registrado no run.
            [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]
            deployments="$(gh api --method GET "repos/$REPO/deployments" -f sha="$DEPLOY_SHA" -F per_page=100)"
            ids="$(jq -r '.[] | select(.creator.login == "vercel[bot]") | .id' <<< "$deployments")"
            while IFS= read -r id; do
              [[ -n "$id" ]] || continue
              statuses="$(gh api "repos/$REPO/deployments/$id/statuses")"
              status="$(jq -c '
                first(.[] | select(.creator.login == "vercel[bot]" and .state == "success")
                  | .url = ([.environment_url, .target_url] | map(select(. != null and . != "")) | first)
                  | select((.url // "") | test("^https://divatdetro(-[a-z0-9-]+-lucas-molinari-s-projects)?[.]vercel[.]app/?$")))
                // empty
              ' <<< "$statuses")"
              [[ -n "$status" ]] || continue
              url="$(jq -r '.url' <<< "$status")"
              environment="$(jq -r '.environment // "auto"' <<< "$status")"
              break
            done <<< "$ids"
            if [[ -z "$url" ]]; then
              echo "Nenhum deploy bem-sucedido da Vercel para o DIVAT nesse SHA." >&2
              exit 1
            fi
            case "${environment,,}" in
              *prod*) url="$PRODUCTION_URL" ;;
            esac
          fi

          delimiter="EOF_$(openssl rand -hex 12)"
          {
            printf 'url<<%s\n%s\n%s\n' "$delimiter" "$url" "$delimiter"
            printf 'environment<<%s\n%s\n%s\n' "$delimiter" "$environment" "$delimiter"
          } >> "$GITHUB_OUTPUT"
      - name: Headers, allowlist e configuração do Supabase
        env:
          DEPLOY_URL: ${{ steps.alvo.outputs.url }}
          DEPLOY_ENVIRONMENT: ${{ steps.alvo.outputs.environment }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: node scripts/check_deploy.mjs "$DEPLOY_URL" "$DEPLOY_ENVIRONMENT"
