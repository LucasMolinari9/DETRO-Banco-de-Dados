# Backup automático (dados) — roda scripts/backup_rest.mjs em MODO PÚBLICO.
#
# Usa a ANON KEY (a mesma pública que o site serve a todo visitante): baixa só as 15
# tabelas que a API pública já expõe. Nada de service key aqui — e a razão NÃO é a visibilidade
# do repositório (estado atual e histórico em docs/adr/0003-repositorio-publico.md).
# A razão é que service key
# em variável de workflow amplia a superfície sem necessidade: quem obtiver acesso ao Actions
# passaria a ler as tabelas de staging. Vale igual em repo público e em repo privado — por isso
# a conclusão sobreviveu às duas trocas. O dump do banco INTEIRO usa backup-private.yml,
# somente manual, com restauração/conferência de todas as tabelas e artifact age por 30 dias
# (SUPABASE_BACKUP_DATABASE_URL + BACKUP_AGE_PUBLIC_KEY obrigatórios) — ver docs/backup.md.
#
# O dump fica como artifact do Actions por 90 dias (aba Actions → run → Artifacts).
#
# Os `uses:` estão presos ao SHA (o `# v4` ao lado é só legenda) — ver docs/semgrep.md
# § "Actions presas ao SHA".
name: Backup

on:
  schedule:
    - cron: '0 6 * * 1' # toda segunda 06:00 UTC (03:00 em Brasília)
  workflow_dispatch:

# GITHUB_TOKEN no mínimo: nenhum destes workflows faz push, abre PR ou comenta.
# Sem este bloco o token herda o default do repo/organização, que pode ser contents: write
# (achado SEC-07 da auditoria de 27/07/2026).
permissions:
  contents: read

concurrency:
  group: public-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false   # nenhum job faz push; token fora do .git/config do runner
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Dump NDJSON via REST (modo público)
        env:
          SUPABASE_URL: https://gontnlfmothfglssbyyk.supabase.co
        shell: bash
        run: |
          SUPABASE_ANON_KEY="$(node <<'NODE'
          const { readFileSync } = require('node:fs');
          const source = readFileSync('app.js', 'utf8');
          const key = source.match(/^const SB_TESTE_KEY\s*=\s*'([\w-]+\.[\w-]+\.[\w-]+)'/m)?.[1];
          if (!key) throw new Error('JWT anon ausente no app.js');
          const payload = JSON.parse(Buffer.from(key.split('.')[1], 'base64url').toString('utf8'));
          const projectRef = new URL(process.env.SUPABASE_URL).hostname.split('.')[0];
          if (payload.role !== 'anon' || payload.ref !== projectRef) {
            throw new Error('A chave do app.js precisa ser uma JWT anon do banco oficial');
          }
          process.stdout.write(key);
          NODE
          )"
          export SUPABASE_ANON_KEY
          node scripts/backup_rest.mjs ./backup_out
      - name: Publicar artifact (90 dias)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: divat-backup-${{ github.run_id }}
          path: backup_out/
          retention-days: 90
          if-no-files-found: error
